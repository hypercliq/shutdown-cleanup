name: Platform validation

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Exact archive produced by development and package validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  platform-checks:
    name: ${{ matrix.runner.label }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner.label }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - label: ubuntu-latest
            architecture: x64
          - label: windows-latest
            architecture: x64
          - label: macos-latest
            architecture: arm64
          - label: macos-26-intel
            architecture: x64
        node: ['22.0.0', 22.x, 24.x, 26.x]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Download the validated archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/release
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Verify the shared archive
        run: node scripts/archive.js verify "$RUNNER_TEMP/release/package.tgz"
      - name: Portable and native OS integration against public package exports
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.runner.architecture }}
        run: |
          set -o pipefail
          node -p "JSON.stringify({platform:process.platform,architecture:process.arch,node:process.version,osRelease:require('node:os').release()})" | tee platform-validation.log
          node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCHITECTURE)"
          npm run test:package -- --runtime-only "$RUNNER_TEMP/release/package.tgz" 2>&1 | tee -a platform-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.runner.label }}-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: platform-validation.log
          if-no-files-found: warn

  support-gate:
    name: Linux, Windows and macOS support gate
    needs: platform-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Linux, Windows and macOS matrix entry
        env:
          RESULT: ${{ needs.platform-checks.result }}
        run: test "$RESULT" = success
