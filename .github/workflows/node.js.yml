name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platforms:
    needs: toolchain
    uses: ./.github/workflows/platform-validation.yml
    with:
      artifact-name: ${{ needs.toolchain.outputs.artifact-name }}

  toolchain:
    uses: ./.github/workflows/package-validation.yml
