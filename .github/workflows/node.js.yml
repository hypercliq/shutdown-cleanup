# Runtime consumers and contributor tools have separate Node.js minimums.

name: Node.js CI

on:
  #   push:
  #     branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Keep the exact engines minimum alongside moving supported majors.
        node-version: ['22.0.0', 22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      # npm 10 can run prepare even with --ignore-scripts; pack with npm 11.
      - name: Use packaging toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Install in an isolated consumer without development tools/hooks.
      - run: npm run test:consumer -- "$RUNNER_TEMP"/hypercliq-shutdown-cleanup-*.tgz

  toolchain:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.22.1', 24.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci --engine-strict
      - run: npm run lint
      - run: npm t
