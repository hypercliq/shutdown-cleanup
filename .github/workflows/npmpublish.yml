name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shutdown-cleanup-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package-validation.yml
    with:
      release: true

  validate-platforms:
    needs: build
    uses: ./.github/workflows/platform-validation.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}

  publish-npm:
    needs: [build, validate-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
      - name: Publish or verify existing npm version
        run: node scripts/release.js publish https://registry.npmjs.org/ "$RUNNER_TEMP/release/package.tgz" "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}

  publish-pages:
    needs: [build, validate-platforms, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check documentation release freshness
        id: freshness
        run: node scripts/pages-release.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
        if: steps.freshness.outputs.deploy == 'true'
      - name: Stage consumer documentation
        if: steps.freshness.outputs.deploy == 'true'
        run: |
          mkdir -p .pages-source
          cp README.md .pages-source/index.md
          cp DEVGUIDE.md LICENSE logo-io.png _config.yml .pages-source/
      - uses: actions/jekyll-build-pages@v1
        if: steps.freshness.outputs.deploy == 'true'
        with:
          source: ./.pages-source
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
        if: steps.freshness.outputs.deploy == 'true'
        with:
          path: ./_site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
