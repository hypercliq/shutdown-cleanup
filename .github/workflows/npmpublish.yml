name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: shutdown-cleanup-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate release metadata
        id: release
        run: node scripts/release.js validate
      - run: npm ci --engine-strict
      - run: npm run check
      - run: npm run test:consumer
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack validated release
        id: archive
        run: |
          echo "artifact-name=release-package-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release"
          archive=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release")
          mv "$RUNNER_TEMP/release/$archive" "$RUNNER_TEMP/release/package.tgz"
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: ${{ runner.temp }}/release/package.tgz
          if-no-files-found: error
          retention-days: 30

  validate-platforms:
    needs: build
    uses: ./.github/workflows/platform-validation.yml
    with:
      artifact-name: ${{ needs.build.outputs.artifact-name }}

  publish-npm:
    needs: [build, validate-platforms]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ runner.temp }}/release
      - name: Publish or verify existing npm version
        run: node scripts/release.js publish https://registry.npmjs.org/ "$RUNNER_TEMP/release/package.tgz" "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}

  publish-pages:
    needs: [build, validate-platforms]
    if: needs.build.outputs.dist-tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v6
      - name: Stage consumer documentation
        run: |
          mkdir -p .pages-source
          cp README.md .pages-source/index.md
          cp DEVGUIDE.md LICENSE logo-io.png _config.yml .pages-source/
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./.pages-source
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v5
